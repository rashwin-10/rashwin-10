<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="50%" stop-color="#240609"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="45" height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0 L0 0 0 45"
            fill="none"
            stroke="#ef4444"
            stroke-width="0.5"
            opacity="0.08"/>
    </pattern>

  </defs>

  <!-- Background -->

  <rect width="1200"
        height="300"
        rx="16"
        fill="url(#bg)"/>

  <rect width="1200"
        height="300"
        rx="16"
        fill="url(#grid)"/>

  <rect x="2"
        y="2"
        width="1196"
        height="296"
        rx="16"
        fill="none"
        stroke="#ef4444"
        stroke-width="2"
        opacity="0.55"/>

  <!-- Corners -->

  <path d="M25 65 V25 H65"
        fill="none"
        stroke="#ef4444"
        stroke-width="5"/>

  <path d="M1135 25 H1175 V65"
        fill="none"
        stroke="#ef4444"
        stroke-width="5"/>

  <path d="M25 235 V275 H65"
        fill="none"
        stroke="#ef4444"
        stroke-width="5"/>

  <path d="M1135 275 H1175 V235"
        fill="none"
        stroke="#ef4444"
        stroke-width="5"/>

  <!-- Status -->

  <rect x="430"
        y="28"
        width="340"
        height="42"
        rx="21"
        fill="#12090a"
        stroke="#ef4444"
        opacity="0.95"/>

  <circle cx="463"
          cy="49"
          r="7"
          fill="#ef4444">

    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.6s"
      repeatCount="indefinite"/>

    <animate
      attributeName="r"
      values="6;8;6"
      dur="1.6s"
      repeatCount="indefinite"/>

  </circle>

  <text x="615"
        y="55"
        text-anchor="middle"
        fill="#f87171"
        font-size="15"
        font-family="monospace"
        font-weight="bold"
        letter-spacing="3">
        THINK-BUILD-CREATE
  </text>

  <!-- Name -->

  <text x="600"
        y="155"
        text-anchor="middle"
        fill="#ffffff"
        font-size="58"
        font-family="Arial, sans-serif"
        font-weight="900"
        letter-spacing="6"
        filter="url(#glow)">

    RASHWIN SP

    <animate
      attributeName="opacity"
      values="0.82;1;0.82"
      dur="3s"
      repeatCount="indefinite"/>

  </text>

  <!-- Main Role -->

  <text x="600"
        y="205"
        text-anchor="middle"
        fill="#ffffff"
        font-size="18"
        font-family="Arial, sans-serif"
        font-weight="bold">
    ELECTRONICS AND COMMUNICATION ENGINEERING
  </text>

  <!-- Interests -->

  <text x="600"
        y="238"
        text-anchor="middle"
        fill="#ef4444"
        font-size="16"
        font-family="monospace"
        font-weight="bold"
        letter-spacing="2">
    EMBEDDED SYSTEMS  |  IoT  |  MATLAB  |  COMPUTER VISION
  </text>

  <!-- Bottom accent -->

  <rect x="545"
        y="265"
        width="110"
        height="4"
        rx="2"
        fill="#ef4444">

    <animate
      attributeName="opacity"
      values="0.35;1;0.35"
      dur="2s"
      repeatCount="indefinite"/>

  </rect>

</svg>
